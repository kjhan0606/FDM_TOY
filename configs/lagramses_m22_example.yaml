metadata:
  purpose: lagramses_science_domain_smoke_case
  calibrated: false
  warning: "m22=1 and seed-mass SMBHs are outside current literature calibration."
model:
  name: wave_df_3d
  alpha_df: 0.341
  drag: true
  fdm_bulk_velocity: ["0 km/s", "0 km/s", "0 km/s"]
binary:
  M1: "1.0e4 Msun"
  M2: "1.0e4 Msun"
  separation: "1 pc"
  eccentricity: 0.0
  orbit: circular
fdm:
  particle_mass: "1.0e-22 eV"
  soliton_mass: "1.0e9 Msun"
  mass_definition: total_profile
  core_radius: "200 pc"
  profile: schive_fit
integration:
  stop_separation: "0.01 pc"
  max_time: "10 Myr"
  output_samples: 500
  rtol: 1.0e-9
  atol: 1.0e-12
